name: publish_repo
on:
  # new releases (including those created when the build_debs workflow is triggered by a tag)
  release:
    types: [published]
  # manual trigger.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  REPO_NAME: netopeer-deb
  CODENAME: bookworm
  COMPONENTS: main
  ARCHITECTURES: amd64 arm64
  RELEASE_RE: ".*"
  FILE_GLOB: "*.deb"

jobs:
  create_repo:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Gather repo contents from releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir ./contents
          releases=$(gh release ls -R $GITHUB_REPOSITORY --limit 999 | awk '{print $(NF-1)}')
          echo Selected releases: "$releases"
          for r in $releases; do
            if [[ "$r" =~ $RELEASE_RE ]]; then
              echo Downloading $FILE_GLOB from $r
              gh release download "$r" -p $FILE_GLOB -D ./contents -R $GITHUB_REPOSITORY --skip-existing || true
            fi
          done

      - name: list contents
        run: ls ./contents/

      - uses: morph027/apt-repo-action@v3.7
        id: create-apt-repo
        with:
          repo-name: ${{ env.REPO_NAME }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          codename: ${{ env.CODENAME }}
          components: ${{ env.COMPONENTS }}
          architectures: ${{ env.ARCHITECTURES }}
          scan-dir: ./contents/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ${{ steps.create-apt-repo.outputs.dir }}

  deploy_repo:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: create_repo
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
